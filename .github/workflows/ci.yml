name: CI

# Tests gate releases only: they run on pull requests into main (and on main
# after a merge). Pull requests into development are not tested; run the
# workflow by hand from the Actions tab to test any branch.
#
# After a merge into main, the publish job builds the image the server
# deploys (docs/deployment-plan.md, part 2): it runs only when the tests pass,
# so an image tagged sha-<commit> means that commit is green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # The job name is the status check that the branch rulesets require.
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notam
          POSTGRES_PASSWORD: notam
          POSTGRES_DB: notam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://notam:notam@localhost:5432/notam_test
        run: pytest

  publish:
    name: publish
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Third-party actions are pinned to full commit SHAs: this job can push
    # images, so a moved tag must not be able to change what it runs.
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<full commit sha>: immutable, what the server deploys.
      # main: moves with every release, for manual runs.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/sanitaravel/starship-notam
          tags: |
            type=sha,format=long
            type=ref,event=branch

      # Builds from the pushed commit (Git context), so no checkout is needed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
