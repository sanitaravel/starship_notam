name: CI

# Tests gate releases only: they run on pull requests into main (and on main
# after a merge). Pull requests into development are not tested; run the
# workflow by hand from the Actions tab to test any branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # The job name is the status check that the branch rulesets require.
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notam
          POSTGRES_PASSWORD: notam
          POSTGRES_DB: notam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://notam:notam@localhost:5432/notam_test
        run: pytest
