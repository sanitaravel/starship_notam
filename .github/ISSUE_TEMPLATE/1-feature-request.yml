name: Feature request
description: Suggest something new for the bot, such as a source to watch, a message change or a new map.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check the [existing issues](https://github.com/sanitaravel/starship_notam/issues?q=is%3Aissue) first, in case it has already been suggested.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the bot is this about?
      options:
        - New data source to watch
        - Existing source (NOTAMs, FAA, Starbase, FCC, FAA DRS, COMPASS)
        - Telegram messages (wording, layout, hashtags)
        - NOTAM map cards
        - Schedule or configuration
        - Docker / deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what is missing or what is hard today, and who it would help.
      placeholder: "Example: Launch windows announced on X are not posted, so the channel misses them until the NOTAMs appear."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the bot do? Be as concrete as you can.
      placeholder: "Example: Check X every cycle and post a message with the window and a link when a new one appears."
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source link
      description: For a new or changed data source, the page or API the bot should read.
      placeholder: https://

  - type: textarea
    id: example
    attributes:
      label: Example message or mock-up
      description: What the Telegram post or map should look like. You can paste text or attach images.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this, or workarounds you use today.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself (see Contributing in the README).
