[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starship_notam"
version = "0.1.0"
description = "Starship NOTAM monitoring and Telegram bot"
requires-python = ">=3.12"

# Direct runtime dependencies, grouped by the package layer that imports them:
#   - core/logging  -> rich, python-dotenv
#   - data          -> Python standard library only (no third-party packages)
#   - parsers       -> beautifulsoup4
#   - scrapers      -> selenium, requests
#   - bot           -> python-telegram-bot, python-dotenv
#   - visualization -> matplotlib, cartopy, pillow, shapely
dependencies = [
    # core / logging layer
    "rich==15.0.0",
    "python-dotenv==1.2.2",
    # parsers layer
    "beautifulsoup4==4.15.0",
    # scrapers layer
    "selenium==4.45.0",
    "requests==2.34.2",
    # bot layer
    "python-telegram-bot==22.8",
    # visualization layer
    "matplotlib==3.11.0",
    "Cartopy==0.25.0",
    "pillow==12.2.0",
    "shapely==2.1.2",
]

[project.optional-dependencies]
# Development / test dependencies. Install with:  pip install -e ".[dev]"
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "hypothesis==6.140.3",
]

# Fully pinned transitive dependencies, kept separate from the declared direct
# dependencies so the full environment stays reproducible. Install the exact
# known-good environment with:  pip install -e ".[lock]"
lock = [
    "annotated-types==0.7.0",
    "anyio==4.14.0",
    "attrs==26.1.0",
    "bs4==0.0.2",
    "certifi==2026.6.17",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "colorama==0.4.6",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "dotenv==0.9.9",
    "fonttools==4.63.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "iniconfig==2.3.0",
    "kiwisolver==1.5.0",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "numpy==2.5.0",
    "oauthlib==3.3.1",
    "outcome==1.3.0.post0",
    "packaging==26.2",
    "pluggy==1.6.0",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "Pygments==2.20.0",
    "pyparsing==3.3.2",
    "pyproj==3.7.2",
    "pyshp==3.0.13",
    "PySocks==1.7.1",
    "python-dateutil==2.9.0.post0",
    "requests-oauthlib==2.0.0",
    "six==1.17.0",
    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "soupsieve==2.8.4",
    "trio==0.33.0",
    "trio-websocket==0.12.2",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "tzdata==2026.2",
    "urllib3==2.7.0",
    "websocket-client==1.9.0",
    "wsproto==1.3.2",
    "xdk==0.9.0",
]

[project.scripts]
starship-notam = "starship_notam.__main__:main"

[tool.setuptools.packages.find]
include = ["starship_notam*"]

# Migrated from pytest.ini
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pytest-asyncio: run async test functions without per-test decorators.
# Required for the bot transport (async) tests.
asyncio_mode = "auto"
