# Starship NOTAM bot stack.
#
#   cp .env.example .env    # fill in TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID
#                           # and POSTGRES_PASSWORD
#   docker compose up -d --build
#
# Start-up order: postgres (healthy) -> prefill (exits
# successfully) -> bot.
#
# On a server, deploy/deploy.sh runs the image CI published for a release
# (NOTAM_IMAGE_TAG=sha-<commit>); see docs/deployment.md.

# Volume names are prefixed with the project name, which would otherwise come
# from the directory name: pinned so a clone in another directory still finds
# the same database.
name: starship_notam

# Docker keeps container logs without a size limit by default.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  # `docker compose up --build` builds this image from the working tree;
  # without --build Compose pulls the published one.
  build: .
  image: ghcr.io/sanitaravel/starship-notam:${NOTAM_IMAGE_TAG:-main}
  env_file: .env
  logging: *logging
  # Container paths win over whatever .env says for local runs.
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-notam}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-notam}
    NOTAM_LOG_DIR: /app/logs
    # Rich wraps log lines at 80 columns when there is no terminal.
    COLUMNS: "160"
  volumes:
    - logs:/app/logs
    - maps:/app/maps
    - cartopy:/home/app/.local/share/cartopy

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-notam}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Records the COMPASS files, Federal Register and Regulations.gov documents
  # and SEC EDGAR filings already online as posted, so the bot announces only
  # new ones. --if-empty makes each script a no-op once its table has rows.
  prefill:
    <<: *app
    command:
      - sh
      - -c
      - >-
        python prefill_compass.py --if-empty
        && python prefill_federal_register.py --if-empty
        && python prefill_regulations_gov.py --if-empty
        && python prefill_sec_edgar.py --if-empty
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *app
    restart: unless-stopped
    # On SIGTERM the bot finishes the item it is posting (or the scrape it is
    # running) and exits; tini as PID 1 passes the signal on.
    init: true
    stop_grace_period: 5m
    # Healthy while the loop keeps making progress (src/healthcheck.py).
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10m
      start_interval: 15s
    depends_on:
      postgres:
        condition: service_healthy
      prefill:
        condition: service_completed_successfully

volumes:
  postgres:
  logs:
  maps:
  cartopy:
